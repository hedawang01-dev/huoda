<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#C7F36B" />
  <meta name="description" content="活搭 HUODA：附近兼职 + 线上技能单，一个地方都能找。" />
  <title>活搭 HUODA - 线上线下兼职平台</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="responsive.css" />
  <link rel="stylesheet" href="status.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" onclick="go('home')" aria-label="返回首页">
        <span class="brand-mark">H</span>
        <span class="brand-copy"><strong>活搭</strong><small>HUODA</small></span>
      </button>
      <nav class="desktop-nav" aria-label="主导航">
        <button data-desktop-route="home" onclick="go('home')">首页</button>
        <button data-desktop-route="find" onclick="goFindWork()">找活</button>
        <button data-desktop-route="publish" onclick="go('publish')">发布兼职</button>
        <button data-desktop-route="messages" onclick="go('messages')">消息 <span id="desktopMessageBadge" class="inbox-badge" hidden></span></button>
        <button data-desktop-route="profile" onclick="go('profile')">我的</button>
      </nav>
      <form class="nav-search" role="search" onsubmit="submitNavSearch(event)">
        <span aria-hidden="true">⌕</span>
        <input id="homeSearch" type="search" aria-label="搜索兼职" placeholder="搜兼职、技能、公司、地点" oninput="searchNow(this.value)" autocomplete="off">
        <button id="navSearchClear" type="button" aria-label="清空搜索" onclick="clearSearch()" hidden>×</button>
        <button class="nav-search-submit" type="submit" aria-label="搜索">搜索</button>
      </form>
      <div class="top-actions">
        <button class="merchant-entry" onclick="openMerchantDesk()">商家入口</button>
        <button class="city-btn" id="cityBtn">广州 ▾</button>
        <button class="avatar-btn" id="accountBtn" aria-label="账户">游</button>
      </div>
    </header>

    <div class="mode-strip" id="modeHint">本地演示 · 数据自动保存</div>
    <div class="sync-status" id="syncStatus" role="status" aria-live="polite" hidden><span></span><button type="button" onclick="H.refreshLive()">重新更新</button></div>
    <main id="app"></main>

    <nav class="bottom-nav">
      <button data-route="home" class="nav-item active"><span class="nav-icon">⌂</span><span>找活</span></button>
      <button data-route="publish" class="nav-item"><span class="nav-icon">＋</span><span>发布</span></button>
      <button data-route="messages" class="nav-item" aria-label="消息"><span class="nav-icon message-nav-icon"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6 3V6a2 2 0 0 1 2-2Z"/><path d="M7 9h10M7 13h7"/></svg><span id="messageNavBadge" class="nav-unread" hidden></span></span><span>消息</span></button>
      <button data-route="profile" class="nav-item"><span class="nav-icon">◉</span><span>我的</span></button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="src/core/services.js"></script>
  <script src="src/services/locationService.js"></script>
  <script src="src/services/recommendationService.js"></script>
  <script src="src/services/taskService.js"></script>
  <script src="src/services/applicationService.js"></script>
  <script src="src/services/favoriteService.js"></script>
  <script src="src/services/messageService.js"></script>
  <script src="src/services/inboxService.js"></script>
  <script src="src/services/notificationService.js"></script>
  <script src="src/services/reviewService.js"></script>
  <script src="src/services/merchantService.js"></script>
  <script src="src/services/authService.js"></script>
  <script src="src/pages/community.js"></script>
  <script src="src/pages/messages.js"></script>
  <script src="src/pages/chatHistory.js"></script>
  <script src="src/pages/responsive.js"></script>
  <script src="src/core/sync.js"></script>
  <script src="src/core/bootstrap.js"></script>
</body>
</html>
