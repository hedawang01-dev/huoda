name: 功能建议
description: 说明具体场景、需要解决的问题和建议
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 哪个用户场景遇到了什么问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议行为与验收方式
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案与范围
